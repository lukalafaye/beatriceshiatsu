apropos:
  kicker: À propos
  titre: À propos de Béatrice Morel
  lede: Le shiatsu s'adresse à tous et à tous les âges.
  paragraphes:
    - Le shiatsu est une technique de rééquilibrage énergétique consistant à
      débloquer les surcharges émotionnelles stagnantes par des pressions
      exercées avec les doigts ou les paumes des mains.
    - Chaque séance commence par un temps d'écoute, puis un bilan énergétique
      qui permet d'adapter le travail à ce que le corps exprime ce jour-là. Le
      shiatsu se pratique habillé, allongé sur un futon, dans un cadre calme et
      sécurisant.
    - Je vous accompagne à mon cabinet de Confrançon, dans l'Ain, ou à votre
      domicile lorsque le déplacement est plus simple pour vous.
  legende_photo: Confrançon · sur rendez-vous
activite:
  kicker: Activité
  titre: Mes séances de shiatsu
  lede: Cinq accompagnements, adaptés à votre besoin du moment.
  prestations:
    - titre: Shiatsu thérapeutique
      chakra: crown
      sous_titre: Bilan énergétique, shiatsu personnalisé, temps d'échange
      description: Stress, surcharges mentales, dépression, perte d'énergie globale,
        douleurs, renforcement du système immunitaire, acouphènes, ménopause,
        insomnie.
      durees:
        - 1h15 à 1h30
        - Enfants jusqu'à 10 ans · 45 mn
    - titre: Shiatsu du dos
      chakra: throat
      sous_titre: "Ciblage des tensions : dos, nuque et tête"
      description: Lâcher prise, réduire le stress, assouplir la colonne vertébrale,
        douleurs lombaires, rééquilibrage énergétique, circulation du dos,
        détente des muscles trapèzes.
      durees:
        - 45 mn
    - titre: Shiatsu des jambes drainage
      chakra: root
      sous_titre: Presso-esthétique, massage shiatsu
      description: Douleurs inflammatoires, circulation sanguine et lymphatique,
        améliorations musculaires, impatiences, récupération après effort,
        jambes lourdes, affinement de la silhouette.
      durees:
        - 1h
    - titre: Shiatsu de confort
      chakra: heart
      sous_titre: Points de shiatsu et étirements sur tous les méridiens du corps
      description: Amélioration de la circulation énergétique, détente profonde.
      durees:
        - 1h30
    - titre: Shiatsu du visage
      chakra: brow
      sous_titre: Points de shiatsu et massage ciblé
      description: Détente des muscles des yeux, du visage et du cou, dégage les voies
        respiratoires, sinusites, maux de tête et migraines, stress, anxiété,
        amélioration sanguine (couperose), élasticité de la peau (ridules,
        rides, sécheresse).
      durees:
        - 45 mn
  note_tarifs: Tarifs communiqués par téléphone, au [tel].
  avertissement: Le shiatsu est une technique de bien-être et de rééquilibrage
    énergétique. Il ne constitue pas un acte médical et ne remplace ni un
    diagnostic, ni un traitement, ni un avis médical.
