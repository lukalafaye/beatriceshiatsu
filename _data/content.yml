      sous_titre: "Ciblage des tensions : dos, nuque et tête"
      description: Lâcher prise, réduire le stress, assouplir la colonne vertébrale,
        douleurs lombaires, rééquilibrage énergétique, circulation du dos,
        détente des muscles trapèzes.
      durees:
        - 45 mn
      tarif: 35 €
    - titre: Shiatsu des jambes drainage
      chakra: root
      sous_titre: Presso-esthétique, massage shiatsu
      description: Douleurs inflammatoires, circulation sanguine et lymphatique,
        améliorations musculaires, impatiences, récupération après effort,
        jambes lourdes, affinement de la silhouette.
      durees:
        - 1h
      tarif: 40 €
    - titre: Shiatsu et Massage énergétique
      chakra: heart
      sous_titre: Points de shiatsu et étirements sur tous les méridiens du corps
      description: Amélioration de la circulation énergétique, détente profonde.
      durees:
        - 1h30
      tarif: 65 €
    - titre: Shiatsu du visage et du crâne
      chakra: brow
      sous_titre: Points de shiatsu et massage ciblé
      description: Détente des muscles des yeux, du visage, du crâne, du cou et de la
        nuque. Dégage les voies respiratoires, sinusites, maux de tête et
        migraines, stress, anxiété, amélioration sanguine (couperose),
        élasticité de la peau (ridules, rides, sécheresse).
      durees:
        - 45 mn
      tarif: 35 €
    - titre: Séance de magnétisme
      chakra: solar
      sous_titre: Harmonisation énergétique par imposition des mains
      description: "Séance d'énergétique, sans pression ni manipulation. "
      durees:
        - 30/40 mn
      tarif: 30€
