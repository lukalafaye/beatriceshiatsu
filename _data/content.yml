  lede: Questions fréquentes et repères pour prolonger le travail entre les séances.
  questions:
    - question: Comment se déroule une séance de shiatsu&nbsp;?
      question_seo: Comment se déroule une séance de shiatsu ?
      reponse: "Un temps d'échange, un bilan énergétique, puis le shiatsu : habillé,
        allongé sur un futon. On termine toujours par un moment de retour au
        calme."
    - question: Quoi porter&nbsp;?
      question_seo: Quoi porter pour une séance de shiatsu ?
      reponse: Une tenue souple et confortable, en matière naturelle si possible. Le
        shiatsu se pratique toujours habillé.
    - question: À quelle fréquence&nbsp;?
      question_seo: À quelle fréquence faire une séance de shiatsu ?
      reponse: Cela dépend de ce que vous venez travailler. Une séance ponctuelle peut
        suffire ; un accompagnement se construit parfois sur plusieurs
        rendez-vous.
