apropos:
  kicker: À propos
  titre: À propos de Béatrice Morel
  lede: Praticienne shiatsu et énergéticienne depuis 2005.
  paragraphes:
    - Je m'appelle Béatrice Morel, je suis praticienne shiatsu et énergéticienne
      depuis 2005.
    - Ayant auparavant suivi plusieurs formations sur le corps humain, je me
      suis toujours intéressée à l'interaction des émotions sur celui-ci.
    - "Ma méthode de travail est simple : j'accompagne les personnes sur des
      douleurs physiques, le système nerveux, les surcharges mentales et
      émotionnelles."
    - Comprendre également ce que nos émotions veulent nous dire, afin d'éviter
      qu'elles ne s'installent trop dans la matière (le corps).
    - Ce travail, je le fais moi-même chaque jour et je le ressens avant de le
      partager dans mes accompagnements.
    - J'ai maintes fois entendu «&nbsp;lâcher prise&nbsp;»,
      «&nbsp;ancrage&nbsp;» lors de mes consultations auprès de thérapeutes.
    - Lâcher prise, je veux bien, mais comment&nbsp;? Puis, un jour, j'ai
      compris que ce fameux moment n'arriverait pas par une volonté mentale,
      mais par un ressenti du corps… À ce moment-là, j'ai ressenti ce que je
      pouvais faire pour aider et permettre à chacun de se sentir en Paix.
    - Lors de mes séances je m'adapte à chaque personne, à chaque vibration, et
      j'entends ce que votre corps veut dire.
    - Nous n'avons pas tous la même manière de gérer la surcharge mentale ou
      émotionnelle, nous ne comprenons pas tous les choses de la même manière…
      Mais nous avons tous un corps qui nous parle.
    - Il n'y a pas de petites émotions, juste celles qui vous appartiennent.
      N'attendez pas d'aller au-delà de vos limites.
  formule: En toute Bienveillance
  portrait_alt: Béatrice Morel, praticienne shiatsu à Confrançon
  legende_photo: Confrançon · sur rendez-vous
activite:
  kicker: Activité
  titre: Le shiatsu
  lede: Le shiatsu s'adresse à tous et à tous les âges.
  paragraphes:
    - Le shiatsu est une technique de rééquilibrage énergétique consistant à
      débloquer les surcharges émotionnelles stagnantes liés aux organes, par
      des pressions et des étirements exercés avec les doigts ou les paumes des
      mains.
    - Chaque séance commence par un temps d'écoute, puis un bilan énergétique
      qui permet d'adapter le travail à ce que le corps exprime ce jour-là. Je
      pratique le shiatsu sur une table de massage, dans un cadre calme et
      bienveillant.
    - Je vous reçois sur la commune de Confrançon, je peux également me déplacer
      si nécessaire.
